name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------
      # GitHub Stats
      # -------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&rank_icon=github&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.PRIVATE_STATS_TOKEN }}

      # -------------------------
      # Top Languages
      # -------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PRIVATE_STATS_TOKEN }}

      # -------------------------
      # Activity Graph
      # -------------------------
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-dark&hide_border=true&area=true&days=35
          output_path: profile/activity.svg
          token: ${{ secrets.PRIVATE_STATS_TOKEN }}

      # -------------------------
      # GitHub Trophies
      # -------------------------
      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=onedark&column=6&row=2&margin-w=8&margin-h=8&no-bg=true&no-frame=true
          path: profile/trophy.svg
          token: ${{ secrets.PRIVATE_STATS_TOKEN }}

      # -------------------------
      # Commit everything
      # -------------------------
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub profile stats" || exit 0

          git pull --rebase origin main
          git push
