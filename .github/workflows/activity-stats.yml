name: Update GitHub Activity Stats

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
        run: |
          gh api graphql \
            -f query='
            query($from: DateTime!) {
              viewer {
                login
                contributionsCollection(from: $from) {
                  totalCommitContributions
                  totalIssueContributions
                  totalPullRequestContributions
                  totalPullRequestReviewContributions
                  totalRepositoriesWithContributedCommits
                  totalRepositoriesWithContributedIssues
                  totalRepositoriesWithContributedPullRequests
                  totalRepositoriesWithContributedPullRequestReviews
                  restrictedContributionsCount
                }
              }
            }' \
            -F from="2000-01-01T00:00:00Z" \
            > activity-data.json

      - name: Generate SVG card
        run: |
          mkdir -p profile

          COMMITS=$(jq '.data.viewer.contributionsCollection.totalCommitContributions' activity-data.json)
          ISSUES=$(jq '.data.viewer.contributionsCollection.totalIssueContributions' activity-data.json)
          PRS=$(jq '.data.viewer.contributionsCollection.totalPullRequestContributions' activity-data.json)
          REVIEWS=$(jq '.data.viewer.contributionsCollection.totalPullRequestReviewContributions' activity-data.json)
          COMMIT_REPOS=$(jq '.data.viewer.contributionsCollection.totalRepositoriesWithContributedCommits' activity-data.json)
          PR_REPOS=$(jq '.data.viewer.contributionsCollection.totalRepositoriesWithContributedPullRequests' activity-data.json)

          cat > profile/activity-stats.svg <<EOF
          <svg width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">

            <rect width="850" height="220" rx="12" fill="#0d1117"/>

            <text x="425" y="38"
                  text-anchor="middle"
                  fill="#f0f6fc"
                  font-size="22"
                  font-family="Arial, sans-serif"
                  font-weight="600">
              GitHub Activity
            </text>

            <text x="425" y="62"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-size="13"
                  font-family="Arial, sans-serif">
              All-time GitHub contribution statistics
            </text>

            <!-- Commits -->
            <rect x="25" y="85" width="125" height="95" rx="10" fill="#161b22"/>
            <text x="87" y="112"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-size="13"
                  font-family="Arial, sans-serif">
              COMMITS
            </text>
            <text x="87" y="150"
                  text-anchor="middle"
                  fill="#f0f6fc"
                  font-size="27"
                  font-family="Arial, sans-serif"
                  font-weight="600">
              ${COMMITS}
            </text>

            <!-- PRs -->
            <rect x="165" y="85" width="125" height="95" rx="10" fill="#161b22"/>
            <text x="227" y="112"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-size="13"
                  font-family="Arial, sans-serif">
              PULL REQUESTS
            </text>
            <text x="227" y="150"
                  text-anchor="middle"
                  fill="#f0f6fc"
                  font-size="27"
                  font-family="Arial, sans-serif"
                  font-weight="600">
              ${PRS}
            </text>

            <!-- Issues -->
            <rect x="305" y="85" width="125" height="95" rx="10" fill="#161b22"/>
            <text x="367" y="112"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-size="13"
                  font-family="Arial, sans-serif">
              ISSUES
            </text>
            <text x="367" y="150"
                  text-anchor="middle"
                  fill="#f0f6fc"
                  font-size="27"
                  font-family="Arial, sans-serif"
                  font-weight="600">
              ${ISSUES}
            </text>

            <!-- Reviews -->
            <rect x="445" y="85" width="125" height="95" rx="10" fill="#161b22"/>
            <text x="507" y="112"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-size="13"
                  font-family="Arial, sans-serif">
              REVIEWS
            </text>
            <text x="507" y="150"
                  text-anchor="middle"
                  fill="#f0f6fc"
                  font-size="27"
                  font-family="Arial, sans-serif"
                  font-weight="600">
              ${REVIEWS}
            </text>

            <!-- Commit Repos -->
            <rect x="585" y="85" width="110" height="95" rx="10" fill="#161b22"/>
            <text x="640" y="112"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-size="12"
                  font-family="Arial, sans-serif">
              COMMIT REPOS
            </text>
            <text x="640" y="150"
                  text-anchor="middle"
                  fill="#f0f6fc"
                  font-size="27"
                  font-family="Arial, sans-serif"
                  font-weight="600">
              ${COMMIT_REPOS}
            </text>

            <!-- PR Repos -->
            <rect x="710" y="85" width="115" height="95" rx="10" fill="#161b22"/>
            <text x="767" y="112"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-size="12"
                  font-family="Arial, sans-serif">
              PR REPOS
            </text>
            <text x="767" y="150"
                  text-anchor="middle"
                  fill="#f0f6fc"
                  font-size="27"
                  font-family="Arial, sans-serif"
                  font-weight="600">
              ${PR_REPOS}
            </text>

          </svg>
          EOF

      - name: Commit activity stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity-stats.svg

          git commit -m "Update GitHub activity stats" || exit 0

          git pull --rebase origin main
          git push
